<!DOCTYPE html>
<html>
	<head>
	<meta charset="utf-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Curso jQuery EscuelaIT - Técnicas para desarrollo de plugins complejos</title>
	 <script src="jquery-4.0.0-beta.min.js"></script>
	 <script src="jquery.plugins.js"></script>
	 <script src="scripts.js"></script>
	 <style>
		input.advanced-validation-error {
			box-shadow: 0 0 0 2px red;
		}

		.advanced-validation-error-message {
			display: block;
			margin-top: 0.35rem;
			color: #b00020;
			font-size: 0.875rem;
		}
	 </style>
	</head>
	<body>

		<form 
            action="enviar.php" 
            method="post"
        >
			
            Nombre: 
            <input 
                type="text" 
                name="nombre" 
                class="advanced-validation" 
                data-advanced-validation-required="true"
                data-advanced-validation-regex="^[a-zA-Z]+$"
                data-advanced-validation-minlength="3"
                data-advanced-validation-maxlength="10"
                data-advanced-validation-message-required="El nombre es obligatorio."
                data-advanced-validation-message-regex="Solo letras, sin números ni espacios."
            />

            <br> <br>
			
            Teléfono: 
            <input 
                type="text" 
                name="telefono" 
                class="advanced-validation" 
                data-advanced-validation
                data-advanced-validation-regex="^[0-9]+$"
                data-advanced-validation-minlength="9"
                data-advanced-validation-maxlength="15"
                data-advanced-validation-message-required="El teléfono es obligatorio."
                data-advanced-validation-message-regex="Solo dígitos numéricos."
                data-advanced-validation-message-minlength="El teléfono debe tener al menos 9 dígitos."
            />
			
            <br> <br> <br>

            <input type="submit" value="Enviar" />
			
            <a href="#" id="validate">validar sin submit</a>			

		</form>
		
        <br> <br>
        
        <div id="message"></div>

	</body>

</html>
