<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../../../assets/favicon/jquery-favicon.svg" type="image/svg+xml">

    <title> 07 Handlebars path - Clase 24 Template System </title>

    <link rel="stylesheet" href="css/template-system.css">
        
    <!--  -----  libreria jQuery  -----  -->
    <script src="../../../assets/libs/jquery-4.0.0-beta.min.js"></script>
    <script src="../../../assets/libs/handlebars.min.js"></script>
    <script src="js/handlebars-helpers.js"> </script>
    <script src="js/07-handlebars-path.js"> </script>

</head>


<body>
    
    <h1> 07 - Handlebars path - Clase 24 Template System </h1>

    <input type="text" id="title" placeholder="title">
    <input type="text" id="id" placeholder="id">
    <input type="text" id="author" placeholder="name">
    <input type="text" id="body" placeholder="body">

    <input type="button" id="myButton" value="Generar HTML">

    <br> <br> <hr> <br> <br>

    <div id="myDiv"></div>
    <textarea id="myTextarea"></textarea>
    <br>

    
    <script id="myTemplate" type="text/x-handlebars-template">
        
        <h2> Template Path </h2>

        <h3>{{title}}</h3>
        <h4>By: {{author.id}} - {{author.name}}</h4>
        <p>
            {{body}}
        </p>
      
        
    </script>
    

</body>
</html>
